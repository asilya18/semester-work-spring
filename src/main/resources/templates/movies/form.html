<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="ru">
<head><title th:text="${movieId != null} ? 'редактировать фильм' : 'добавить фильм'">фильм</title></head>
<body>
<div layout:fragment="content">
    <div class="filmstrip"></div>
    <div class="form-container wide">
        <h1 class="form-title" th:text="${movieId != null} ? 'редактировать фильм' : 'новый фильм'"></h1>
        <form th:action="${movieId != null} ? @{/movies/{id}/edit(id=${movieId})} : @{/movies}"
              th:object="${form}" method="post">
            <div class="form-group">
                <label for="title">название*</label>
                <input type="text" id="title" th:field="*{title}" placeholder="название фильма" autofocus>
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>
            <div class="form-group">
                <label for="year">год выпуска</label>
                <input type="number" id="year" th:field="*{year}" placeholder="например: 2023" min="1888" max="2026">
                <span class="field-error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></span>
            </div>
            <div class="form-group">
                <label for="durationMinutes">продолжительность в минутах </label>
                <input type="number" id="durationMinutes" th:field="*{durationMinutes}" placeholder="например: 120" min="1">
            </div>

            <div class="form-group">
                <label for="posterUrl">ссылка на постер</label>
                <input type="url" id="posterUrl" th:field="*{posterUrl}" placeholder="https://...">
                <!-- type="url" — браузер проверяет что введена валидная ссылка -->
            </div>
            <div class="form-group">
                <label for="description">описание</label>
                <textarea id="description" th:field="*{description}" placeholder="добавьте краткое описание фильма"></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-full"
                        th:text="${movieId != null} ? 'сохранить изменения' : 'добавить фильм'"></button>
                <a th:href="${movieId != null} ? @{/movies/{id}(id=${movieId})} : @{/movies}"
                   class="btn btn-muted btn-full">отмена</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
