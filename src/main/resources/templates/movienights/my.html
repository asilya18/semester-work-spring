<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="ru">
<head><title>мои киновечера</title></head>
<body>
<div layout:fragment="content">
    <div class="filmstrip"></div>
    <div class="page-header">
        <h1>мои киновечера</h1>
        <a th:href="@{/movienights/new}" class="btn btn-primary btn-sm">+ cоздать cвой киновечер</a>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:start">
        <div>
            <h2 class="section-title" style="margin-bottom:1rem">я организатор</h2>
            <div th:if="${created.empty}" class="empty-state" style="padding:2rem 1rem">
                <p>ты ещё не создавал(а) киновечерa</p>
                <a th:href="@{/movienights/new}" class="btn btn-primary btn-sm" style="margin-top:0.75rem">cоздать свой первый киновечер</a>
            </div>

            <div th:each="mn : ${created}" class="card" style="margin-bottom:1rem">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.5rem">
                    <h3 class="card-title" th:text="${mn.title}" style="margin-bottom:0"></h3>
                    <span class="badge"
                          th:classappend="${mn.status.name() == 'PLANNED'} ? 'badge-planned' : (${mn.status.name() == 'ACTIVE'} ? 'badge-ongoing' : 'badge-finished')"
                          th:text="${mn.status.name() == 'PLANNED'} ? 'запланирован' : (${mn.status.name() == 'ACTIVE'} ? 'идёт' : 'завершён')">
                    </span>
                </div>
                <p class="card-meta">📅 <span th:text="${#temporals.format(mn.eventDate, 'dd.MM.yyyy HH:mm')}"></span></p>
                <p class="card-meta" th:if="${mn.platform}">платформа: <span th:text="${mn.platform}"></span></p>
                <div class="card-actions">
                    <a th:href="@{/movienights/{id}(id=${mn.id})}" class="btn btn-outline btn-sm">подробнее</a>
                    <a th:href="@{/movienights/{id}/edit(id=${mn.id})}" class="btn btn-muted btn-sm">изменить</a>
                </div>
            </div>
        </div>

        <div>
            <h2 class="section-title" style="margin-bottom:1rem">я участник</h2>
            <div th:if="${participating.empty}" class="empty-state" style="padding:2rem 1rem">
                <p>ты ещё не вступал(а) в киновечера других людей</p>
                <a th:href="@{/movienights}" class="btn btn-outline btn-sm" style="margin-top:0.75rem">смотреть ленту киновечеров</a>
            </div>

            <div th:each="mn : ${participating}" th:if="${mn.creator.id != currentUser.id}" class="card" style="margin-bottom:1rem">
                <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.5rem">
                    <h3 class="card-title" th:text="${mn.title}" style="margin-bottom:0"></h3>
                    <span class="badge"
                          th:classappend="${mn.status.name() == 'PLANNED'} ? 'badge-planned' : (${mn.status.name() == 'ACTIVE'} ? 'badge-ongoing' : 'badge-finished')"
                          th:text="${mn.status.name() == 'PLANNED'} ? 'запланирован' : (${mn.status.name() == 'ACTIVE'} ? 'идёт' : 'завершён')">
                    </span>
                </div>
                <p class="card-meta">📅 <span th:text="${#temporals.format(mn.eventDate, 'dd.MM.yyyy HH:mm')}"></span></p>
                <p class="card-meta" th:if="${mn.platform}">платформа: <span th:text="${mn.platform}"></span></p>
                <p class="card-meta">организатор: <span th:text="${mn.creator.username}"></span></p>
                <div class="card-actions">
                    <a th:href="@{/movienights/{id}(id=${mn.id})}" class="btn btn-outline btn-sm">подробнее</a>
                </div>
            </div>
        </div>

    </div>
</div>
</body>
</html>
