apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: movienight-backend
  namespace: team-project
spec:
  ingressClassName: nginx
  rules:
    - host: api.movienight.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: movienight-backend
                port:
                  number: 8080
