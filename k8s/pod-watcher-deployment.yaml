apiVersion: apps/v1
kind: Deployment
metadata:
  name: pod-watcher
  namespace: team-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pod-watcher
  template:
    metadata:
      labels:
        app: pod-watcher
    spec:
      serviceAccountName: pod-watcher
      containers:
        - name: pod-watcher
          image: python:3.12-slim
          workingDir: /app
          command:
            - sh
            - -c
            - pip install --no-cache-dir kubernetes requests && python main.py
          env:
            - name: NTFY_TOPIC
              valueFrom:
                secretKeyRef:
                  name: ntfy
                  key: topic
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: watcher-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: watcher-code
          configMap:
            name: pod-watcher-code