services:
  db:
    image: postgres:15-alpine
    container_name: movienight_db
    environment:
      POSTGRES_DB: movienight
      POSTGRES_USER: movienight
      POSTGRES_PASSWORD: movienight
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - movienight_network

  redis:
    image: redis:7-alpine
    container_name: movienight_redis
    ports:
      - "6380:6379"
    networks:
      - movienight_network

  app:
    build: .
    container_name: movienight_app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/movienight
      SPRING_DATASOURCE_USERNAME: movienight
      SPRING_DATASOURCE_PASSWORD: movienight
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      TZ: Europe/Moscow
    depends_on:
      - db
      - redis
    networks:
      - movienight_network

volumes:
  postgres_data:

networks:
  movienight_network: